<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>whynot778 GTA HUD</title>
<style>
:root{
  --purple:#8f19ff;
  --purple-top:#b85cff;
  --green:#4ed52b;
  --green-top:#7dff4d;
  --red:#ff4d4d;
  --black:#050505;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
}
body{
  font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#hud{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  aspect-ratio:3.38/1;
  max-height:100%;
  display:flex;
  align-items:stretch;
  gap:10px;
  padding:6px 7px;
  pointer-events:none;
  user-select:none;
  background:transparent;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));
}

/* ЛЕВЫЙ БЛОК — САМОКАТ */
.scooter-frame{
  width:30%;
  min-width:30%;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.scooter-frame svg{
  width:100%;
  height:100%;
  display:block;
  overflow:hidden;
}

/* ПРАВЫЙ БЛОК — ВСЁ ПЛОТНО ДРУГ К ДРУГУ */
.info{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding-top:0;
}
.time-row{
  height:38%;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  overflow:visible;
}
#clock{
  color:#fff;
  white-space:nowrap;
  font-size:clamp(42px,10.6vw,116px);
  line-height:.82;
  letter-spacing:.018em;
  -webkit-text-stroke:5px var(--black);
  paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--black);
}

/* Фиолетовая полоска ближе ко времени */
.hp-row{
  height:18%;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:0 1.2%;
  margin-top:-1px;
}
.hp-outer{
  width:100%;
  height:78%;
  min-height:24px;
  border:6px solid var(--black);
  border-radius:13px;
  overflow:hidden;
  background:#161616;
}
#hp{
  width:100%;
  height:100%;
  background:linear-gradient(180deg,var(--purple-top) 0 34%,var(--purple) 35% 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.28),0 0 9px rgba(143,25,255,.42);
  transition:width .28s ease;
}

/* Деньги тоже сразу под полоской */
.money-row{
  height:44%;
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  margin-top:-2px;
}
#money{
  color:var(--green);
  white-space:nowrap;
  font-size:clamp(54px,13.1vw,145px);
  line-height:.86;
  letter-spacing:.02em;
  -webkit-text-stroke:6px var(--black);
  paint-order:stroke fill;
  text-shadow:5px 5px 0 var(--black);
}
#moneyFx{
  position:absolute;
  right:2%;
  top:-16%;
  opacity:0;
  white-space:nowrap;
  font-size:clamp(24px,4.8vw,58px);
  line-height:1;
  -webkit-text-stroke:3px var(--black);
  paint-order:stroke fill;
  text-shadow:3px 3px 0 var(--black);
}
#moneyFx.plus{color:var(--green-top)}
#moneyFx.minus{color:var(--red)}
#moneyFx.run{animation:moneyFx 1.25s ease-out forwards}
#money.bump{animation:bump .3s ease-out}
@keyframes moneyFx{
  0%{opacity:0;transform:translateY(14px) scale(.9)}
  12%{opacity:1;transform:translateY(0) scale(1.08)}
  70%{opacity:1;transform:translateY(-4px) scale(1)}
  100%{opacity:0;transform:translateY(-24px) scale(.98)}
}
@keyframes bump{
  0%{transform:scale(1)}
  40%{transform:scale(1.045)}
  100%{transform:scale(1)}
}

/* Тестовая панель: ?test=1 */
#testPanel{
  display:none;
  position:fixed;
  left:8px;
  bottom:8px;
  z-index:999;
  gap:6px;
  flex-wrap:wrap;
  background:rgba(0,0,0,.82);
  padding:8px;
  pointer-events:auto;
  font-family:Arial,sans-serif;
}
#testPanel.show{display:flex}
#testPanel input,#testPanel button{font-size:15px;padding:6px 8px}
#testPanel input{width:90px}
</style>
</head>

    <div class="hp-row">
      <div class="hp-outer"><div id="hp"></div></div>

      <div id="money">₽ 0</div>

</div>

<div id="testPanel">
  <input id="testValue" type="number" value="350">
  <button onclick="setMoney(testVal())">!set</button>
  <button onclick="addMoney(testVal())">!add</button>
  <button onclick="removeMoney(testVal())">!remove</button>
  <button onclick="setHp(testVal())">!hp</button>
  <button onclick="resetHud()">!reset</button>
</div>

<script>
(() => {
  "use strict";

  const OWNER = "whynot778";
  const STORAGE_KEY = "whynot778_gta_hud_v2";

  const moneyEl = document.getElementById("money");
  const moneyFxEl = document.getElementById("moneyFx");
  const hpEl = document.getElementById("hp");
  const clockEl = document.getElementById("clock");

  let state = {money:0,hp:100};

  const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
  const toInt = v => Math.trunc(Number(v)||0);

  function load(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
      if(Number.isFinite(Number(saved.money))) state.money=Math.max(0,toInt(saved.money));
      if(Number.isFinite(Number(saved.hp))) state.hp=clamp(toInt(saved.hp),0,100);
    }catch(e){}
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }catch(e){}
  }

  function formatMoney(v){
    return "₽ " + Number(v).toLocaleString("ru-RU");
  }

  function render(){
    moneyEl.textContent=formatMoney(state.money);
    hpEl.style.width=state.hp+"%";
    save();
  }

  function bumpMoney(){
    moneyEl.classList.remove("bump");
    void moneyEl.offsetWidth;
    moneyEl.classList.add("bump");
  }

  function showMoneyFx(amount,positive){
    if(!amount) return;
    moneyFxEl.classList.remove("run","plus","minus");
    void moneyFxEl.offsetWidth;
    moneyFxEl.textContent=(positive?"+ ":"- ")+"₽"+Math.abs(amount).toLocaleString("ru-RU");
    moneyFxEl.classList.add(positive?"plus":"minus","run");
  }

  window.setMoney = v => {
    state.money=Math.max(0,toInt(v));
    render();
    bumpMoney();
  };

  window.addMoney = v => {
    const n=Math.max(0,toInt(v));
    if(!n) return;
    state.money+=n;
    render();
    bumpMoney();
    showMoneyFx(n,true);
  };

  window.removeMoney = v => {
    const n=Math.max(0,toInt(v));
    if(!n) return;
    state.money=Math.max(0,state.money-n);
    render();
    bumpMoney();
    showMoneyFx(n,false);
  };

  window.setHp = v => {
    state.hp=clamp(toInt(v),0,100);
    render();
  };

  window.resetHud = () => {
    state={money:0,hp:100};
    render();
  };

  function updateClock(){
    const time=new Intl.DateTimeFormat("ru-RU",{
      timeZone:"Europe/Moscow",
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }).format(new Date()).replace(".",":");
    clockEl.textContent=time+" СПБ";
  }

  updateClock();
  setInterval(updateClock,1000);

  function segmentsToText(segments){
    if(!Array.isArray(segments)) return "";
    return segments
      .map(s => s && typeof s.text==="string" ? s.text : "")
      .join("")
      .trim();
  }

  function normalizeUser(v){
    return String(v||"")
      .trim()
      .replace(/^@/,"")
      .toLowerCase();
  }

  function parseCommand(text){
    const t=String(text||"").trim();

    let m;
    if((m=t.match(/^!set\s+(\d+)$/i)))    return window.setMoney(m[1]);
    if((m=t.match(/^!add\s+(\d+)$/i)))    return window.addMoney(m[1]);
    if((m=t.match(/^!remove\s+(\d+)$/i))) return window.removeMoney(m[1]);
    if((m=t.match(/^!hp\s+(\d{1,3})$/i))) return window.setHp(m[1]);
    if(/^!reset$/i.test(t))               return window.resetHud();
  }

  /*
    В актуальном Moblin payload может быть:
    message.chat.message.user
    message.chat.message.segments

    Поддерживаем также старую форму message.chat.user / segments.
  */
  function handleMoblinMessage(message){
    if(!message || !message.chat) return;

    const chat =
      (message.chat.message && typeof message.chat.message==="object")
        ? message.chat.message
        : message.chat;

    const user=normalizeUser(chat.user);
    if(user!==normalizeUser(OWNER)) return;

    const text =
      segmentsToText(chat.segments) ||
      (typeof chat.message==="string" ? chat.message.trim() : "");

    parseCommand(text);
  }

  function connectMoblin(){
    /*
      В Moblin API объект объявлен как global const `moblin`,
      поэтому использовать window.moblin нельзя.
    */
    if(typeof moblin==="undefined"){
      console.log("Moblin API пока не найден.");
      return false;
    }

    try{
      moblin.onmessage=handleMoblinMessage;
      moblin.subscribe({chat:{prefix:"!"}});
      console.log("Moblin HUD: chat commands connected.");
      return true;
    }catch(e){
      console.log("Moblin HUD connect error:",e);
      return false;
    }
  }

  /* Несколько повторных попыток на случай поздней инициализации WebView */
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(connectMoblin() || tries>=12) clearInterval(timer);
  },500);

  connectMoblin();

  window.testVal=()=>document.getElementById("testValue").value;

  if(new URLSearchParams(location.search).get("test")==="1"){
    document.getElementById("testPanel").classList.add("show");
  }

  load();
  render();
})();
</script>

</body>
